# ── Terminal capabilities ─────────────────────────────────────────────
# True color + italics; tmux-256color is the modern default inside tmux
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"
set -ga terminal-overrides ",*256col*:Tc"
set -ga terminal-overrides ",alacritty:Tc"
# Pass through undercurl / colored underlines (useful for nvim diagnostics)
set -ga terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -ga terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

# ── Mouse ─────────────────────────────────────────────────────────────
set -g mouse on

# ── Focus events (nvim autoread, terminal title sync) ─────────────────
set -g focus-events on

# ── Clipboard (OSC 52 + pbcopy) ───────────────────────────────────────
# Forward copies through to iTerm via OSC 52, and let apps inside tmux
# (nvim, etc.) write to the system clipboard via passthrough.
set -g set-clipboard on
set -g allow-passthrough on

# Mouse-drag selection copies to system clipboard and keeps the selection
# visible (no jump to bottom on release).
bind -T copy-mode    MouseDragEnd1Pane send -X copy-pipe-no-clear "pbcopy"
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-no-clear "pbcopy"

# `y` in copy-mode also copies to system clipboard.
bind -T copy-mode    y send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"

# Prefix + p pastes from the system clipboard.
bind p run "pbpaste | tmux load-buffer - && tmux paste-buffer"

# ── Snappier key handling for nvim ────────────────────────────────────
set -sg escape-time 10
set -g repeat-time 400

# ── Sensible defaults ─────────────────────────────────────────────────
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g set-titles on
set -g set-titles-string "#S ▸ #W"
setw -g mode-keys vi
set -g status-keys emacs

# ── Theme (Nord) ──────────────────────────────────────────────────────
source-file ~/.tmux/nord.conf
