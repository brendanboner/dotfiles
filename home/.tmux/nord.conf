# Nord theme for tmux — palette + rich status bar.
# Hex used directly (relies on Tc terminal-overrides in ~/.tmux.conf).
#
# Nord palette
# nord0  #2E3440   nord4  #D8DEE9   nord8  #88C0D0   nord12 #D08770
# nord1  #3B4252   nord5  #E5E9F0   nord9  #81A1C1   nord13 #EBCB8B
# nord2  #434C5E   nord6  #ECEFF4   nord10 #5E81AC   nord14 #A3BE8C
# nord3  #4C566A   nord7  #8FBCBB   nord11 #BF616A   nord15 #B48EAD

# ── Status bar layout ─────────────────────────────────────────────────
set  -g status on
set  -g status-interval 5
set  -g status-position bottom
set  -g status-justify left
set  -g status-style "bg=#3B4252,fg=#D8DEE9"

set  -g status-left-length 60
set  -g status-right-length 100

# Left:  ▎ session name ▎
set  -g status-left "#[fg=#2E3440,bg=#88C0D0,bold] #S #[fg=#88C0D0,bg=#3B4252,nobold]▎ "

# Right: hostname • date • time
set  -g status-right "#[fg=#4C566A,bg=#3B4252]▎#[fg=#81A1C1,bg=#3B4252] #h #[fg=#4C566A]▎#[fg=#EBCB8B] %a %d %b #[fg=#4C566A]▎#[fg=#A3BE8C,bold] %H:%M #[default]"

# ── Windows ───────────────────────────────────────────────────────────
setw -g window-status-separator ""
setw -g window-status-format         "#[fg=#4C566A,bg=#3B4252] #I #[fg=#D8DEE9]#W "
setw -g window-status-current-format "#[fg=#3B4252,bg=#88C0D0]▎#[fg=#2E3440,bg=#88C0D0,bold] #I #W #[fg=#88C0D0,bg=#3B4252,nobold]▎"
setw -g window-status-activity-style "fg=#EBCB8B,bg=#3B4252,bold"
setw -g window-status-bell-style     "fg=#BF616A,bg=#3B4252,bold"

# ── Panes ─────────────────────────────────────────────────────────────
set  -g pane-border-style        "fg=#4C566A"
set  -g pane-active-border-style "fg=#88C0D0"
set  -g display-panes-colour        "#4C566A"
set  -g display-panes-active-colour "#88C0D0"

# ── Messages & modes ──────────────────────────────────────────────────
set  -g message-style         "bg=#4C566A,fg=#ECEFF4"
set  -g message-command-style "bg=#4C566A,fg=#88C0D0"
setw -g mode-style            "bg=#434C5E,fg=#ECEFF4"
setw -g clock-mode-colour     "#88C0D0"

# ── Plugin colours (tmux-prefix-highlight etc.) ───────────────────────
set  -g @prefix_highlight_fg              "#2E3440"
set  -g @prefix_highlight_bg              "#EBCB8B"
set  -g @prefix_highlight_show_copy_mode  on
set  -g @prefix_highlight_copy_mode_attr  "fg=#2E3440,bg=#A3BE8C,bold"
